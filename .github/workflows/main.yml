name: Build Citra Android (original fork)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CI: false   # <-- This skips the entire CI-detection block in CMake, avoiding the error

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Patch NDK and CMake versions in build.gradle
        run: |
          sed -i "s/ndkVersion = '.*'/ndkVersion = '26.1.10909125'/" src/android/app/build.gradle
          sed -i "s/version '.*'/version '3.22.1'/" src/android/app/build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Grant gradlew permission (inside src/android)
        run: chmod +x src/android/gradlew

      - name: Build debug APK
        run: cd src/android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: citra-android-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
